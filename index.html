<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jack R. Kaufman | UTSW</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    <style>
        body { 
            max-width: 100%; margin: 0; padding: 0; background-color: #ffffff; color: #000; line-height: 1.6;
            background-image: url('enso_transparent.png'); background-repeat: no-repeat;
            background-position: calc(100% - 20px) 150px; background-size: 550px; background-attachment: fixed;
            font-weight: 450;
        }
        main { max-width: 1100px; margin: auto; padding: 4rem 1.5rem; display: grid; grid-template-columns: 1fr 1.5fr; gap: 4rem; align-items: start; }
        .profile-column { display: flex; flex-direction: column; align-items: center; text-align: center; position: sticky; top: 4rem; }
        
        /* The Circle Crop styling */
        .profile-image { 
            width: 280px; height: 280px; object-fit: cover; border-radius: 50%; 
            border: 6px solid #f9f9f9; box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
            margin-bottom: 1.5rem; background-color: #fff; 
        }

        h1 { font-size: 2.8rem; margin: 0; font-weight: 800; border: none; letter-spacing: -1px; }
        .subtitle { font-size: 1.15rem; color: #444; margin-bottom: 1.5rem; }
        .cv-link { text-transform: uppercase; letter-spacing: 1.5px; font-size: 0.9rem; font-weight: 700; color: #fff; background-color: #000; padding: 0.8rem 2.5rem; border-radius: 4px; text-decoration: none; display: inline-block; }
        .dissertation-box { margin: 2.5rem 0; padding: 2rem; background: rgba(253, 253, 253, 0.9); border-left: 6px solid #005596; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }

        @media (max-width: 900px) {
            main { grid-template-columns: 1fr; gap: 3rem; padding: 2rem 1rem; }
            .profile-column { position: relative; top: 0; }
        }
    </style>
</head>
